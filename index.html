<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
        content="MR RAJPOOT STUDIO — Cloud streaming platform. Stream to YouTube 24/7 from the cloud without keeping your computer on." />
    <title>MR RAJPOOT STUDIO — Cloud Streaming Platform</title>
    <script>
      (function() {
        try {
          var state = localStorage.getItem('ui-storage');
          if (state) {
            var parsed = JSON.parse(state);
            var theme = parsed && parsed.state ? parsed.state.theme : 'light';
            var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.add('light');
            }
          } else {
            document.documentElement.classList.add('light'); // default light
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
