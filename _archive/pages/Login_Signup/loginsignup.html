<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up Form</title>
    <link rel="stylesheet" href="loginsignup.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="login-container">
            <h1>Welcome Back</h1>
            <h2>Login</h2>
            <form action="">
                <div class="input-group">
                    <input type="email" placeholder="Enter Email">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" id="password">
                    <img src="https://res.cloudinary.com/ams1rfsh/image/upload/v1787466688/hide_y2jxif.png" alt="" id="icon">
                </div>
                <button type="submit">Login</button>
            </form>
        </div>


        <div class="partition" id="card">
            <h2>New User?</h2>
            <p>Create an account to enjoy our services.</p>
            <button type="button" id="switchBtn">Create Account</button>
        </div>


        <div class="signup-container">
            <h1>Welcome</h1>
            <h2>Sign Up</h2>
            <form action="">
                <div class="input-group">
                    <input type="text" placeholder="Enter Name">
                </div>
                <div class="input-group">
                    <input type="email" placeholder="Enter Email">
                </div>
                <div class="input-group">
                    <input type="password" placeholder="Password" >
                    <img src="https://res.cloudinary.com/ams1rfsh/image/upload/v1787466688/hide_y2jxif.png" alt="" >
                </div>
                <button type="submit">Sign Up</button>
            </form>
        </div>
    </div>

    <script src="./loginsignup.js"></script>
</body>
</html>
